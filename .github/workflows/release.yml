name: Release asset
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that gets the file attached, for example 1.0.0
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: The built file must equal the committed one
        run: git diff --exit-code -- dist/home-connect-direct-cards.js
      - name: Attach the file to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/home-connect-direct-cards.js --clobber
