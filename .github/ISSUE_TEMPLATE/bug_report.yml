name: Bug report
description: Problem with one of the five cards
body:
  - type: input
    id: versions
    attributes:
      label: Card, Home Assistant and integration version
    validations:
      required: true
  - type: input
    id: appliance
    attributes:
      label: Card type and appliance model
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Steps to reproduce. Separate real appliance observations from simulations.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration or error message
      description: Do not include credentials or private appliance keys.
      render: yaml
